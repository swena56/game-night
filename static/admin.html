<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Admin</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin { max-width: 900px; margin: 0 auto; padding: 16px; }
    .admin h1 { font-size: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .admin select { width: auto; }
    .admin input[type=search] { flex: 1; min-width: 180px; }
    .admin input[type=checkbox] { width: 18px; height: 18px; margin: 0; flex: none; }
    .admin textarea { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: var(--field);
      border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 10px; resize: vertical; }
    .admin label.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
    .bulk { position: sticky; top: 0; z-index: 2; background: var(--panel2); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 8px 12px; margin: 12px 0; }
    .item { background: var(--panel); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; border-left: 4px solid var(--danger); }
    .item.idea { border-left-color: var(--accent2); }
    .item.table { border-left-color: var(--accent); }
    .item.done { opacity: .6; }
    .item .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 6px; align-items: center; }
    .item .text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .item .note { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--tint-2); font-size: 13px; }
    .item details { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .item pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #0008; padding: 8px; border-radius: 8px; max-height: 260px; overflow: auto; }
    .item .row.actions { margin-top: 8px; }
    .high { color: var(--danger); font-weight: 700; }
    form.edit { background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .group { margin: 18px 0 8px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .shots img { display: block; max-width: 160px; max-height: 160px; border: 1px solid var(--line); border-radius: 8px; }
    .shots figure { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    #login { max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
    .admin [hidden] { display: none; }
    #message { min-height: 1.4em; color: var(--accent); }
    #copyBox { margin-bottom: 10px; }
    .item .run { margin-top: 8px; font-size: 13px; }
    .item .run pre { font-size: 12px; color: var(--muted); }
    .item .run pre.log { max-height: 360px; min-height: 3em; background: var(--field); }
    .log div { margin-bottom: 4px; }
    .log .text, .log .result { color: var(--text); }
    .log .tool { color: var(--accent); }
    .log .error { color: var(--danger); }
    .log .output { padding-left: 14px; opacity: .75; }
    .banner, .item .ship { background: var(--panel2); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 12px; margin: 10px 0 0; }
    .steps { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 8px 0; font-size: 12px; color: var(--muted); }
    .steps span + span::before { content: '→ '; }
    .steps .now { color: var(--accent); font-weight: 700; }
    .ship { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .ship .warn { color: var(--danger); white-space: pre-wrap; overflow-wrap: anywhere; }
    .ship ul { margin: 0; padding-left: 18px; overflow-wrap: anywhere; }
    .ship label.file { display: flex; gap: 8px; align-items: flex-start; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="admin">
    <h1>🛠️ Feedback admin</h1>
    <p class="hint left">Review, add, edit and resolve player reports. Open it on the server's own device at <code>localhost:8000</code>, or from elsewhere over HTTPS with the admin password.</p>
    <p id="loginMessage" role="status"></p>
    <form id="login" hidden>
      <label class="field">Admin password<input type="password" id="password" autocomplete="current-password" maxlength="200" required></label>
      <button class="primary" type="submit">🔑 Sign in</button>
    </form>
    <div id="tool" hidden>
    <div class="row">
      <button class="primary" id="add">➕ Add report</button>
      <button id="refresh">🔄 Refresh</button>
      <button id="signOut" hidden>🚪 Sign out</button>
      <span id="counts" class="hint"></span>
    </div>
    <div id="restartBox" role="status"></div>
    <div id="addBox"></div>
    <div class="row" style="margin-top:12px">
      <select id="fStatus" aria-label="Status"><option value="open">Open</option><option value="done">Done</option><option value="">Open + done</option></select>
      <select id="fKind" aria-label="Kind"><option value="">All kinds</option><option value="bug">🐞 Bugs</option><option value="idea">💡 Ideas</option><option value="table">🎱 Tables</option></select>
      <select id="fPriority" aria-label="Priority"><option value="any">Any priority</option><option value="high">High</option><option value="">Normal</option><option value="low">Low</option></select>
      <select id="fGame" aria-label="Game"><option value="*">All games</option></select>
      <select id="sort" aria-label="Order"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="priority">By priority</option><option value="game">Grouped by game</option></select>
      <input type="search" id="search" placeholder="Search text, notes, names, #id" aria-label="Search">
    </div>
    <div class="bulk row">
      <label class="row"><input type="checkbox" id="all"> <span id="picked">Select all shown</span></label>
      <button data-bulk='{"status":"done"}'>✅ Resolve</button>
      <button data-bulk='{"status":"open"}'>↩︎ Reopen</button>
      <select id="bulkPriority" aria-label="Set priority of selected"><option value="-">Set priority…</option><option value="high">High</option><option value="">Normal</option><option value="low">Low</option></select>
      <button id="copy" title="Copy the selected reports as a list">📋 Copy</button>
    </div>
    <p id="message" role="status"></p>
    <div id="copyBox"></div>
    <div id="list"></div>
    </div>
  </main>
  <script>
    // Everything from a report goes into the page through textContent or .value: reports are untrusted input.
    const KINDS = { bug: '🐞 Bug', idea: '💡 Idea', table: '🎱 Table' };
    const PRIORITIES = [['high', 'High'], ['', 'Normal'], ['low', 'Low']];
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const button = (text, onclick, cls = '') => { const b = el('button', cls, text); b.type = 'button'; b.onclick = onclick; return b; };
    const picked = new Set();
    const drafts = new Map();   // report id -> its open edit form, kept across redraws so typing isn't lost
    let items = [];
    let jobs = null;            // report id -> its Claude run; null where the server doesn't offer Implement (not localhost)
    const openRuns = new Map(); // report id -> whether its run output is unfolded, kept across redraws
    const logs = new Map();     // report id -> its live log view, kept across redraws so it keeps its lines and scroll position
    const MAX_LOG_LINES = 1500;
    let poll = 0;
    let dev = null;             // the dev server: when it loaded its code, and which files changed since
    let restarting = false;
    const ships = new Map();    // report id -> its open "commit, push & resolve" panel, kept across redraws
    const RUN_STATES = { running: '⏳ Claude is working', done: '🤖 Claude finished: review the changes', failed: '⚠️ The run failed',
      stopped: '⏹ Stopped', 'timed out': '⌛ Timed out' };
    const running = () => Object.values(jobs || {}).some((j) => j.state === 'running');

    // Redraws only when a run changed (a running one reports through its live log), and keeps checking while one is going.
    async function loadJobs() {
      clearTimeout(poll);
      const key = () => JSON.stringify([jobs && Object.entries(jobs).map(([id, j]) => [id, j.state, j.started, j.files, j.commit, j.pushed]), dev?.stale, dev?.cant]);
      const was = key(), before = jobs;
      try { ({ jobs, server: dev = null } = await api('/api/admin/implement')); } catch (e) { if (e.status === 404) jobs = dev = null; }
      for (const [id, j] of Object.entries(jobs || {})) {
        if (before?.[id]?.state !== 'running' || j.state === 'running') continue;
        openRuns.set(+id, true);
        say(`${RUN_STATES[j.state] || j.state} (#${id}).${dev?.stale.length ? ' Restart the dev server to try it: see the top of the page.' : ' Reload the game page to try it.'}`);
      }
      drawRestart();
      if (running()) poll = setTimeout(loadJobs, 5000);
      if (key() !== was) render();
    }

    // Shown while the server runs older Python than what is on disk. Pages and scripts under static/ only need a reload.
    function drawRestart() {
      const box = $('restartBox');
      if (!restarting && !dev?.stale.length) { box.replaceChildren(); return; }
      const banner = el('div', 'banner');
      if (restarting) banner.append(el('b', '', '🔁 Restarting the dev server…'));
      else {
        const some = dev.stale.slice(0, 4).join(', ') + (dev.stale.length > 4 ? ` and ${dev.stale.length - 4} more` : '');
        banner.append(el('b', '', '🔁 Restart the dev server to run the new code'), el('p', 'hint left', `Changed since it started: ${some}`));
        if (dev.cant) banner.append(el('p', 'hint left', dev.cant));
        else {
          const go = button('🔁 Restart dev server', restartServer, 'primary');
          go.disabled = running();
          if (go.disabled) banner.append(el('p', 'hint left', 'Claude is still working. Restart when it has finished.'));
          banner.append(go);
        }
      }
      box.replaceChildren(banner);
    }

    async function restartServer() {
      const players = dev.players ? `${dev.players} player connection(s) are open and will drop for a few seconds. ` : '';
      if (!confirm(`Restart the dev server? ${players}Rooms are saved and come back.`)) return;
      const boot = dev.boot;
      if (!await save('/api/admin/restart', {}, 'Restarting…')) return;
      restarting = true; drawRestart();
      let back = false;
      for (let n = 0; n < 30 && !back; n++) {
        await new Promise((done) => setTimeout(done, 1000));
        try { back = (await api('/api/admin/implement')).server.boot !== boot; } catch { /* still down */ }
      }
      restarting = false;
      say(back ? 'The dev server restarted. Reload the game page and try the change.' : "⚠️ The dev server didn't come back. Look at data/server.log.");
      await loadJobs();
      drawRestart();
    }

    // Where a report is: Claude works, you restart and try it, then Resolve commits and pushes.
    function steps(i, job) {
      const at = job.state === 'running' ? 0 : i.status === 'done' ? 3 : job.commit || ships.has(i.id) ? 2 : 1;
      const row = el('div', 'steps');
      row.append(...['1 Implement', '2 Restart & try it', '3 Review, commit & push', '4 Resolved'].map((name, n) => el('span', n === at ? 'now' : '', name)));
      return row;
    }

    const hasChanges = (job) => job && job.state !== 'running' && !job.pushed && (job.commit || job.files?.length);

    function openShip(i) {
      const box = el('div', 'ship');
      const view = { box, message: Object.assign(el('textarea'), { rows: 4, maxLength: 3900 }), picked: null };
      view.message.value = `Implement feedback #${i.id} (${i.kind}${gameOf(i) ? `, ${gameOf(i)}` : ''})\n\nCo-Authored-By: Claude <noreply@anthropic.com>`;
      ships.set(i.id, view);
      render();
      review(i);
    }
    const closeShip = (id) => { ships.delete(id); render(); };

    async function review(i) {
      const view = ships.get(i.id);
      if (!view) return;
      view.box.replaceChildren(el('div', '', 'Checking what would be committed…'));
      let plan, error;
      try { plan = await api('/api/admin/feedback/implement/review', { id: i.id, ...(view.picked && { files: view.picked }) }); } catch (e) { error = e.message; }
      if (ships.get(i.id) !== view) return;
      const parts = [el('b', '', `Resolve #${i.id}: commit and push`)];
      const note = (cls, text) => parts.push(el('div', cls, text));
      if (error) note('warn', error);
      if (plan?.commit) note('', `Already committed as ${plan.commit.slice(0, 7)}. Only the push is left.`);
      if (plan?.blocked) note('warn', plan.blocked);
      for (const f of plan?.files || []) {
        const row = el('label', 'file'), tick = Object.assign(el('input'), { type: 'checkbox', checked: f.picked });
        tick.onchange = () => {
          view.picked = plan.files.filter((x) => x.path === f.path ? tick.checked : x.picked).map((x) => x.path);
          review(i);
        };
        const notes = [f.earlier && "has other uncommitted work, which stays out", f.later && 'edited again after the run: those edits are included'].filter(Boolean);
        row.append(tick, el('span', '', f.path + (notes.length ? ` (${notes.join('; ')})` : '')));
        parts.push(row);
      }
      if (plan?.files?.some((f) => f.earlier || !f.picked)) note('hint left', "The commit holds less than what you tried: it hasn't been run on its own.");
      if (plan?.diff) { const d = el('details'); d.append(el('summary', '', 'Show the diff'), el('pre', '', plan.diff)); parts.push(d); }
      if (plan?.ahead.length) {
        const list = el('ul'); list.append(...plan.ahead.map((line) => el('li', '', line)));
        const d = el('details'); d.append(el('summary', 'warn', `The push also sends ${plan.ahead.length} earlier commit(s) to ${plan.upstream}`), list); parts.push(d);
      }
      if (dev?.stale.length) note('warn', "The dev server hasn't been restarted since the code changed, so it isn't running this version.");
      if (plan?.token) { const label = el('label', 'field', 'Commit message (pushed as written)'); label.append(view.message); parts.push(label); }
      const actions = el('div', 'row');
      if (plan?.token || plan?.commit) {
        const go = button(plan.commit ? '⬆️ Push & resolve' : '⬆️ Commit, push & resolve', async () => {
          if (!confirm(`${plan.commit ? 'Push' : 'Commit and push'} to ${plan.upstream}${plan.ahead.length ? `, along with ${plan.ahead.length} earlier commit(s)` : ''}, and resolve #${i.id}?`)) return;
          go.disabled = true; go.textContent = '⏳ Pushing…';
          const ok = await save('/api/admin/feedback/implement/ship', { id: i.id, token: plan.token, message: view.message.value, ...(view.picked && { files: view.picked }) },
            `#${i.id} is committed, pushed and resolved.`);
          if (ok) { ships.delete(i.id); await load(); return; }
          const why = $('message').textContent;
          await loadJobs();
          await review(i);
          say(why);
        }, 'primary');
        actions.append(go);
      }
      actions.append(button('🔄 Review again', () => review(i)),
        button('✅ Resolve only', () => {
          if (!confirm(`Resolve #${i.id} without committing or pushing anything?`)) return;
          ships.delete(i.id);
          update([i.id], { status: 'done' }, `#${i.id} is now done. Nothing was committed or pushed.`);
        }),
        button('Cancel', () => closeShip(i.id)));
      parts.push(actions);
      view.box.replaceChildren(...parts);
    }

    async function implementReport(i) {
      if (!confirm(`Run Claude on #${i.id}? It edits the files in this repository. It doesn't commit, restart the server or resolve the report.`)) return;
      if (await save('/api/admin/feedback/implement', { id: i.id }, `Claude started on #${i.id}.`)) await loadJobs();
    }

    function logView(id, job) {
      let view = logs.get(id);
      if (view?.started === job.started) return view;
      clearTimeout(view?.timer);
      view = { started: job.started, next: 0, top: 0, follow: true, busy: false, timer: 0, pre: el('pre', 'log') };
      // follow the newest line until the reader scrolls up; scrolling back to the bottom follows again
      view.pre.onscroll = () => {
        const p = view.pre;
        view.top = p.scrollTop;
        view.follow = p.scrollHeight - p.scrollTop - p.clientHeight < 30;
      };
      logs.set(id, view);
      return view;
    }
    const placeLog = (view) => { view.pre.scrollTop = view.follow ? view.pre.scrollHeight : view.top; };

    // Fetches the lines added since last time, and again shortly while the run goes on and its box is open and on the page.
    async function followLog(id) {
      const view = logs.get(id);
      if (!view || view.busy || !view.pre.isConnected || !view.pre.closest('details').open) return;
      clearTimeout(view.timer);
      view.busy = true;
      const wasRunning = jobs?.[id]?.state === 'running';   // asked before reading, so the last lines of a run aren't missed
      let wait = wasRunning ? 1500 : 0;
      try {
        const data = await api(`/api/admin/implement/log?id=${id}&from=${view.next}`);
        view.next = data.next;
        view.pre.append(...data.entries.map(([kind, text]) => el('div', kind, text)));
        while (view.pre.childElementCount > MAX_LOG_LINES) view.pre.firstChild.remove();
        if (data.entries.length) placeLog(view);
        view.error?.remove();
        if (data.more) wait = 50;
      } catch (e) {
        view.error?.remove();
        view.error = el('div', 'error', e.status === 404 ? 'No live log. If the server is older than this page, restart it.' : `Couldn't read the log: ${e.message}`);
        view.pre.append(view.error);
        wait = e.status ? 0 : 5000;   // the server answered: asking again won't help. No answer: it may be restarting
      }
      view.busy = false;
      if (logs.get(id) === view && wait) view.timer = setTimeout(() => followLog(id), wait);
    }

    async function copyText(text, done) {
      try {
        await navigator.clipboard.writeText(text);
        say(done);
      } catch {   // no clipboard access: show it to copy by hand
        const box = Object.assign(el('textarea'), { rows: Math.min(8, text.split('\n').length + 1), readOnly: true, value: text });
        $('copyBox').replaceChildren(box);
        box.select();
      }
    }

    function runBox(i, job) {
      const box = el('details', 'run'), view = logView(i.id, job);
      box.open = openRuns.get(i.id) ?? job.state === 'running';
      box.ontoggle = () => { openRuns.set(i.id, box.open); if (box.open) { placeLog(view); followLog(i.id); } };
      box.append(el('summary', '', `${RUN_STATES[job.state] || job.state} · started ${new Date(job.started * 1000).toLocaleString()}`));
      if (job.state !== 'running') box.append(el('pre', '', job.detail));
      box.append(view.pre);
      if (job.state !== 'running') {
        const next = job.pushed ? `Pushed as ${job.commit.slice(0, 7)}.`
          : job.commit ? `Committed as ${job.commit.slice(0, 7)}, not pushed yet. Press Resolve to push.`
          : job.files?.length ? `Changed ${job.files.length} file(s). ${dev?.stale.length ? 'Restart the dev server (top of the page), then try it.' : 'Reload the game page and try it.'} Then press Resolve to review, commit and push.`
          : job.files ? 'The run changed no files.' : "This run has no starting snapshot, so Resolve can't commit it.";
        box.append(el('div', 'hint left', next));
      }
      if (job.resume) {
        const row = el('div', 'row');
        const copy = button('📋 Copy resume command', () => copyText(job.resume,
          job.state === 'running' ? 'Copied. Claude is still working: stop it or let it finish before you resume.' : 'Copied the resume command. Paste it in a terminal.'));
        copy.title = job.resume;
        row.append(copy);
        box.append(row);
      }
      box.append(el('div', 'hint', `Full log: ${job.log}`));
      return box;
    }
    const gameOf = (i) => i.context?.game || '';
    const say = (text) => { $('message').textContent = text; };

    async function api(path, body) {
      const r = await fetch(path, body && { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(j.error || `The server answered ${r.status}.`), { status: r.status });
      return j;
    }

    const sayLogin = (text) => { $('loginMessage').textContent = text; };
    let remote = false;
    // The tool is hidden, not emptied, so a half-typed report survives a sign-in that ran out.
    function showLogin(text) {
      $('tool').hidden = true; $('login').hidden = false;
      sayLogin(text);
    }

    async function load() {
      try {
        const data = await api('/api/admin/feedback');
        items = data.items;
        remote = !!data.remote;
        $('signOut').hidden = !remote;
        $('tool').hidden = false; $('login').hidden = true;
        sayLogin('');
      } catch (e) {
        if (e.status === 401) showLogin(remote ? 'Your sign-in ended. Sign in again.' : '');
        else { $('tool').hidden = false; say(`⚠️ Couldn't load the inbox: ${e.message}`); }
        return false;
      }
      for (const id of picked) if (!items.some((i) => i.id === id)) picked.delete(id);
      const games = [...new Set(items.map(gameOf).filter(Boolean))].sort();
      const select = $('fGame'), was = select.value;
      select.replaceChildren(new Option('All games', '*'), new Option('No game', ''), ...games.map((g) => new Option(g, g)));
      select.value = [...select.options].some((o) => o.value === was) ? was : '*';
      render();
      loadJobs();
      return true;
    }

    // Send a change, then reload. Returns false (and says why) when the server refused it.
    async function save(path, body, done) {
      try { await api(path, body); } catch (e) {
        // a remote sign-in that ran out loses the save route, so the server answers "Not found"
        if (remote && (e.status === 401 || e.status === 404)) showLogin('Your sign-in ended. Sign in again; what you typed is kept.');
        else say(`⚠️ ${e.message}`);
        return false;
      }
      say(done);
      return true;
    }
    const update = async (ids, change, done) => { if (await save('/api/admin/feedback/update', { ids, ...change }, done)) await load(); };

    function shown() {
      const status = $('fStatus').value, kind = $('fKind').value, priority = $('fPriority').value, game = $('fGame').value;
      const q = $('search').value.trim().toLowerCase();
      const list = items.filter((i) => (!status || i.status === status) && (!kind || i.kind === kind)
        && (priority === 'any' || (i.priority || '') === priority) && (game === '*' || gameOf(i) === game)
        && (!q || (q[0] === '#' ? `#${i.id}` === q : [i.text, i.note, i.name, gameOf(i)].join('\n').toLowerCase().includes(q))));
      const rank = (i) => PRIORITIES.findIndex(([v]) => v === (i.priority || ''));
      const by = { new: (a, b) => b.id - a.id, old: (a, b) => a.id - b.id, priority: (a, b) => rank(a) - rank(b) || b.id - a.id,
        game: (a, b) => gameOf(a).localeCompare(gameOf(b)) || b.id - a.id };
      return list.sort(by[$('sort').value]);
    }

    // The actions apply only to ticked reports you can see, so a filter never leaves hidden ones to be changed by surprise.
    const selected = () => shown().filter((i) => picked.has(i.id));

    function syncBulk() {
      const list = shown(), n = selected().length;
      $('picked').textContent = n ? `${n} selected` : 'Select all shown';
      $('all').checked = n > 0 && n === list.length;
      $('all').indeterminate = n > 0 && n < list.length;
      for (const c of document.querySelectorAll('.bulk button, #bulkPriority')) c.disabled = !n;
    }

    function render() {
      const open = items.filter((i) => i.status === 'open');
      $('counts').textContent = `${open.length} open (${open.filter((i) => i.priority === 'high').length} high) · ${items.length - open.length} done`;
      const list = $('list'), rows = shown(), grouped = $('sort').value === 'game';
      list.replaceChildren();
      if (!rows.length) list.append(el('p', 'empty', 'No reports match. 🎉'));
      let group = null;
      for (const i of rows) {
        if (grouped && gameOf(i) !== group) {
          group = gameOf(i);
          list.append(el('h3', 'group', `${group || 'No game'} (${rows.filter((x) => gameOf(x) === group).length})`));
        }
        list.append(drafts.get(i.id) || card(i));
      }
      for (const [id, view] of logs) if (view.pre.isConnected) { placeLog(view); followLog(id); }
      syncBulk();
    }

    function card(i) {
      const box = el('div', `item ${i.kind} ${i.status}`);
      const meta = el('div', 'meta'), ctx = i.context || {};
      const tick = el('input'); tick.type = 'checkbox'; tick.checked = picked.has(i.id); tick.setAttribute('aria-label', `Select report ${i.id}`);
      tick.onchange = () => { tick.checked ? picked.add(i.id) : picked.delete(i.id); syncBulk(); };
      meta.append(tick, el('b', '', `${KINDS[i.kind] || i.kind} #${i.id}`), el('span', '', new Date(i.at * 1000).toLocaleString()),
        el('span', '', i.source === 'admin' ? `added here${i.name ? ` for ${i.name}` : ''}` : i.name ? `from ${i.name}` : 'anonymous'));
      if (ctx.game) meta.append(el('span', '', `${ctx.game} · ${ctx.phase}`));
      if (ctx.errors?.length) meta.append(el('span', '', `⚠️ ${ctx.errors.length} JS error(s)`));
      if (i.priority) meta.append(el('span', i.priority === 'high' ? 'high' : '', i.priority === 'high' ? '▲ High' : '▼ Low'));
      if (i.status === 'done') meta.append(el('span', '', '✅ Done'));
      box.append(meta, el('div', 'text', i.text));
      if (i.note) box.append(el('div', 'note', `📝 ${i.note}`));
      if (i.images?.length) {
        const shots = el('div', 'shots');
        for (const name of i.images) {
          const link = el('a'); link.href = shotUrl(name); link.target = '_blank'; link.rel = 'noopener';
          link.append(picture(link.href, `Screenshot on report ${i.id}`));
          shots.append(link);
        }
        box.append(shots);
      }
      const extra = (title, text) => { const d = el('details'); d.append(el('summary', '', title), el('pre', '', text)); box.append(d); };
      if (i.origin) box.append(el('div', 'hint', `Merged from ${i.origin.source}, where it is report #${i.origin.id}.`));
      if (i.original_text && i.original_text !== i.text) extra('Original text (edited)', i.original_text);
      if (Object.keys(ctx).length) extra('Technical details', JSON.stringify(ctx, null, 2));
      const actions = el('div', 'row actions');
      const next = i.status === 'done' ? 'open' : 'done';
      const job = jobs?.[i.id];
      // with uncommitted changes from a run, Resolve opens the commit & push review first
      const ship = next === 'done' && hasChanges(job);
      actions.append(
        button(ship ? '✅ Resolve…' : next === 'done' ? '✅ Resolve' : '↩︎ Reopen',
          () => ship ? openShip(i) : update([i.id], { status: next }, `#${i.id} is now ${next}.`), next === 'done' ? 'primary' : ''),
        button('✏️ Edit', () => { drafts.set(i.id, editor(i)); render(); }));
      if (job?.state === 'running') {
        actions.append(button('⏹ Stop Claude', async () => {
          if (await save('/api/admin/feedback/implement/stop', { id: i.id }, `Stopped the run on #${i.id}.`)) await loadJobs();
        }));
      } else if (jobs && i.status === 'open' && i.kind !== 'table') {
        const go = button(job ? '🤖 Implement again' : '🤖 Implement', () => implementReport(i));
        go.disabled = running();
        if (go.disabled) go.title = 'Claude is working on another report';
        actions.append(go);
      }
      box.append(actions);
      if (job) box.append(steps(i, job));
      if (ships.has(i.id) && i.status === 'open') box.append(ships.get(i.id).box);
      if (job) box.append(runBox(i, job));
      return box;
    }

    const shotUrl = (name) => `/api/admin/image?name=${encodeURIComponent(name)}`;
    const picture = (src, alt) => Object.assign(el('img'), { src, alt, loading: 'lazy' });
    const MAX_SHOTS = 4, MAX_SIDE = 1600, MAX_URL = 2.6e6;

    // A pasted or chosen picture as a data URL the server takes: scaled to fit, PNG when small enough, else JPEG.
    async function shrink(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
      const canvas = Object.assign(el('canvas'), { width: Math.round(bitmap.width * scale) || 1, height: Math.round(bitmap.height * scale) || 1 });
      const g = canvas.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, canvas.width, canvas.height);
      g.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const png = canvas.toDataURL('image/png');
      return png.length <= MAX_URL ? png : canvas.toDataURL('image/jpeg', 0.85);
    }

    // The screenshot part of a form: paste anywhere in the form, or pick files (phones).
    function shotField(form, saved) {
      const added = [], removed = new Set();
      const box = el('div', 'field'), list = el('div', 'shots');
      const input = Object.assign(el('input'), { type: 'file', accept: 'image/*', multiple: true, hidden: true });
      const count = () => saved.length - removed.size + added.length;
      function draw() {
        const figure = (src, remove) => { const f = el('figure'); f.append(picture(src, 'Screenshot'), button('✖ Remove', () => { remove(); draw(); })); return f; };
        list.replaceChildren(...saved.filter((n) => !removed.has(n)).map((n) => figure(shotUrl(n), () => removed.add(n))),
          ...added.map((url) => figure(url, () => added.splice(added.indexOf(url), 1))));
      }
      async function take(files) {
        for (const file of files) {
          let url;
          try { url = await shrink(file); } catch { say("⚠️ That file isn't a picture this browser can read."); continue; }
          if (count() >= MAX_SHOTS) { say(`⚠️ A report holds up to ${MAX_SHOTS} screenshots.`); break; }
          added.push(url);
        }
        draw();
      }
      form.addEventListener('paste', (event) => {
        const files = [...event.clipboardData?.items || []].filter((x) => x.kind === 'file' && x.type.startsWith('image/')).map((x) => x.getAsFile()).filter(Boolean);
        if (!files.length) return;   // ordinary text pastes as usual
        event.preventDefault();
        take(files);
      });
      input.onchange = () => { take([...input.files]); input.value = ''; };
      const pick = el('div', 'row');
      pick.append(button('📎 Add screenshot', () => input.click()), el('span', '', 'or paste one while typing (Ctrl+V)'));
      box.append(el('span', '', 'Screenshots'), pick, input, list);
      draw();
      return { box, read: () => ({ ...(added.length && { add_images: added }), ...(removed.size && { remove_images: [...removed] }) }) };
    }

    // The add form (no report) and the edit form (one report) are the same fields.
    function editor(i) {
      const form = el('form', 'edit');
      const field = (label, control, value) => { const l = el('label', 'field', label); control.value = value; l.append(control); return [l, control]; };
      const choose = (options) => { const s = el('select'); s.append(...options.map(([v, t]) => new Option(t, v))); return s; };
      const isTable = i?.kind === 'table';
      const [kindRow, kind] = field('Kind', choose(Object.entries(KINDS).filter(([k]) => isTable ? k === 'table' : k !== 'table')), i?.kind || 'bug');
      const [prioRow, priority] = field('Priority', choose(PRIORITIES), i?.priority || '');
      const [nameRow, name] = field('From (optional)', Object.assign(el('input'), { maxLength: 16 }), i?.name || '');
      const [textRow, text] = field('Report', Object.assign(el('textarea'), { rows: 4, maxLength: 2000, required: true, minLength: 5 }), i?.text || '');
      const [noteRow, note] = field('Admin note (players never see this)', Object.assign(el('textarea'), { rows: 2, maxLength: 4000 }), i?.note || '');
      const top = el('div', 'row'); top.append(kindRow, prioRow, nameRow);
      const close = () => { if (i) { drafts.delete(i.id); render(); } else $('addBox').replaceChildren(); };
      const submit = el('button', 'primary', i ? '💾 Save' : '➕ Add'); submit.type = 'submit';
      const buttons = el('div', 'row'); buttons.append(submit, button('Cancel', close));
      const shots = shotField(form, i?.images || []);
      form.append(el('b', '', i ? `Editing #${i.id}` : 'New report'), top, textRow, shots.box, noteRow, buttons);
      // only what was changed is sent, so saving a note can't undo someone else's edit of the text
      const read = () => ({ kind: kind.value, priority: priority.value, name: name.value, text: text.value, note: note.value });
      const before = read();
      form.onsubmit = async (event) => {
        event.preventDefault();
        submit.disabled = true;
        const now = read();
        const change = { ...(i ? Object.fromEntries(Object.entries(now).filter(([k, v]) => v !== before[k])) : now), ...shots.read() };
        const ok = await save(i ? '/api/admin/feedback/update' : '/api/admin/feedback/add', i ? { ids: [i.id], ...change } : change, i ? `Saved #${i.id}.` : 'Report added.');
        submit.disabled = false;
        if (!ok) return;
        close();
        await load();
      };
      return form;
    }

    function markdown(list) {
      return list.map((i) => `- #${i.id} [${i.kind}${i.priority ? `, ${i.priority}` : ''}${gameOf(i) ? `, ${gameOf(i)}` : ''}, ${i.status}] ${i.text.replace(/\s+/g, ' ')}`
        + (i.note ? `\n  - Note: ${i.note.replace(/\s+/g, ' ')}` : '')
        + (i.images?.length ? `\n  - Screenshots in data/feedback-shots/: ${i.images.join(', ')}` : '')).join('\n');
    }

    $('login').onsubmit = async (event) => {
      event.preventDefault();
      try {
        await api('/api/admin/login', { password: $('password').value });
      } catch (e) {
        sayLogin(`⚠️ ${e.message}`);
        return;
      }
      $('password').value = '';
      load();
    };
    $('signOut').onclick = async () => {
      await api('/api/admin/logout', {}).catch(() => {});
      items = []; remote = false; picked.clear(); drafts.clear(); logs.clear(); ships.clear();
      for (const id of ['list', 'addBox', 'copyBox', 'restartBox']) $(id).replaceChildren();
      showLogin('Signed out.');
    };
    $('add').onclick = () => { if (!$('addBox').firstChild) $('addBox').replaceChildren(editor()); $('addBox').querySelector('textarea').focus(); };
    $('refresh').onclick = async () => { if (await load()) say('Refreshed.'); };
    for (const id of ['fStatus', 'fKind', 'fPriority', 'fGame', 'sort']) $(id).onchange = () => { $('copyBox').replaceChildren(); render(); };
    $('search').oninput = render;
    $('all').onchange = () => { for (const i of shown()) $('all').checked ? picked.add(i.id) : picked.delete(i.id); render(); };
    for (const b of document.querySelectorAll('[data-bulk]')) {
      b.onclick = () => {
        const change = JSON.parse(b.dataset.bulk), ids = selected().map((i) => i.id);
        const unshipped = change.status === 'done' ? ids.filter((id) => hasChanges(jobs?.[id])) : [];
        if (unshipped.length) {
          if (!confirm(`Mark ${ids.length} report(s) done? This commits and pushes nothing, including Claude's changes for #${unshipped.join(', #')}.`)) return;
        } else if (ids.length > 1 && !confirm(`Mark ${ids.length} reports ${change.status}?`)) return;
        picked.clear();
        update(ids, change, `${ids.length} report(s) now ${change.status}.`);
      };
    }
    $('bulkPriority').onchange = () => {
      const priority = $('bulkPriority').value, ids = selected().map((i) => i.id);
      $('bulkPriority').value = '-';
      update(ids, { priority }, `Priority set on ${ids.length} report(s).`);
    };
    $('copy').onclick = () => copyText(markdown(selected()), `Copied ${selected().length} report(s).`);
    // pick up reports that arrived while the tab was in the background
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    load();
  </script>
</body>
</html>
